<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yanpb OJ Bridge</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{width:340px;padding:0;margin:0;background:#0c1420;color:#edf5fb;font:13px/1.55 Inter,system-ui,sans-serif}.hero{padding:18px;background:linear-gradient(135deg,#17324a,#102033 62%,#153d36);border-bottom:1px solid #29445a}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#63deb1;color:#09271d;font-weight:900;font-size:18px}.title{font-size:16px;font-weight:850}.version{color:#8da9bd;font:11px/1.4 ui-monospace,monospace}.hero p{margin:10px 0 0;color:#b9cada}.content{padding:14px 16px 16px}.card{padding:12px;margin-bottom:10px;border:1px solid #294157;border-radius:10px;background:#111e2d}.statusline{display:flex;align-items:flex-start;gap:8px;font-weight:750}.dot{width:9px;height:9px;margin-top:6px;border-radius:50%;background:#f0b55f;box-shadow:0 0 0 4px #f0b55f20}.ready .dot{background:#63deb1;box-shadow:0 0 0 4px #63deb120}p{color:#b8c8d8;margin:8px 0}input,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #38536d;background:#192a3e;color:#fff}input{font:700 20px/1 ui-monospace,monospace;letter-spacing:6px;text-align:center}button{border:0;background:#63deb1;color:#09271d;font-weight:800;cursor:pointer}button.secondary{border:1px solid #38536d;background:#192a3e;color:#dceaf3}.meta{white-space:pre-wrap;font-size:11px;color:#9eb4c6;margin-top:7px}.last{font-size:12px;color:#63deb1;margin:7px 0}.toggle{display:flex;align-items:center;gap:8px;font-size:12px;margin:10px 0}.toggle input{width:15px;margin:0}.safety{display:block;padding-top:10px;border-top:1px solid #263b4e;color:#8fa5b7;font-size:11px}</style></head>
<body><div class="hero"><div class="brand"><div class="logo">OJ</div><div><div class="title">Yanpb OJ Result Bridge</div><div class="version" id="version"></div></div></div><p>独立连接 CodeLab，监测 Codeforces、AtCoder 与洛谷的真实官方判题结果。</p></div><main class="content">
<section class="card"><div class="statusline"><span class="dot"></span><span id="status">检测连接中…</span></div><div id="diagnostics" class="meta"></div></section>
<section class="card" id="pairArea"><strong>首次配对</strong><p>在 CodeLab「OJ 浏览器连接」中生成一次性 6 位授权码。</p><input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button id="pair">连接 CodeLab</button></section>
<button id="retry" class="secondary">立即检测并同步判题</button><div id="lastOfficialSync" class="last"></div><label class="toggle"><input id="notifyVerdicts" type="checkbox" checked>官方判题桌面通知</label><small class="safety">仅访问本机 127.0.0.1:10045 和受支持的 OJ 页面；不读取密码、Cookie，不绕过验证码，也不会自动点击提交。</small></main>
<script src="popup.js"></script></body></html>
