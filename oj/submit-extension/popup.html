<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yanpb OJ Bridge</title>
<style>body{width:300px;padding:16px;margin:0;background:#121d2c;color:#eaf1f8;font:13px/1.6 system-ui}h3{margin:0 0 10px;font-size:16px}p{color:#b8c8d8}input,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border-radius:7px;border:1px solid #41556f;background:#223148;color:#fff}button{border:0;background:#6adeb5;color:#112b25;font-weight:700;cursor:pointer}#status{white-space:pre-wrap;color:#f4bb75}small{color:#a6b6c9}</style></head>
<body><h3>Yanpb OJ Result Bridge</h3><p>Competitive Companion 继续负责导入题目；本扩展负责监测浏览器里真实的官方提交记录，并向 CodeLab 回传判题状态。</p>
<div id="status">检测连接中…</div>
<div id="pairArea"><p>第一次连接：在 CodeLab「极速 OJ」中获取一次性 6 位授权码。</p><input id="pin" inputmode="numeric" maxlength="6" placeholder="CodeLab 授权码"><button id="pair">连接 CodeLab</button></div>
<button id="retry">检测连接并同步判题</button><div id="lastOfficialSync" style="font-size:12px;color:#68ddb2;margin:6px 0"></div><div id="diagnostics" style="white-space:pre-wrap;font-size:11px;color:#b9cddd;margin:6px 0"></div><label style="display:flex;align-items:center;gap:6px;font-size:12px;margin:8px 0"><input id="notifyVerdicts" type="checkbox" checked style="width:15px;margin:0">官方判题桌面通知</label><small>不读取密码和 Cookie；遇到登录、验证码或不会自行提交代码，不读取账号密码；只核对官方结果。</small>
<script src="popup.js"></script></body></html>
